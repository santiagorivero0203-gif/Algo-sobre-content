<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Santi.Dev · HyperFrames GSAP Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #060709;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .bg-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(16, 185, 129, 0.22) 0%, rgba(6, 7, 9, 1) 70%);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px;
        box-sizing: border-box;
      }
      .badge-wrapper {
        display: block;
        margin-bottom: 40px;
      }
      .badge {
        font-family: monospace;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #10B981;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.35);
        padding: 14px 32px;
        border-radius: 9999px;
      }
      .title-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .title-line-1 {
        font-size: 108px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.04em;
        color: #F8FAFC;
      }
      .title-line-2 {
        font-size: 114px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.04em;
        color: #10B981;
      }
      .subtitle {
        font-size: 38px;
        font-weight: 500;
        color: #94A3B8;
        margin-top: 36px;
        text-align: center;
        letter-spacing: -0.01em;
        max-width: 820px;
      }
      .footer-badge {
        position: absolute;
        bottom: 90px;
        font-family: monospace;
        font-size: 22px;
        color: #94A3B8;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-5wif" id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="3">
      <div data-hf-id="hf-rc9h" class="bg-glow"></div>
      <section data-hf-id="hf-19no" id="title-card" class="clip" data-start="0" data-duration="3">
        <div data-hf-id="hf-uhmk" id="badge-el" class="badge-wrapper">
          <span data-hf-id="hf-asv3" class="badge">SANTI.DEV · HYPERFRAMES</span>
        </div>
        <div data-hf-id="hf-rjmy" id="title-el" class="title-container">
          <div data-hf-id="hf-loq8" class="title-line-1">CÓDIGO PURO</div>
          <div data-hf-id="hf-k3zk" class="title-line-2">A 60 FPS</div>
        </div>
        <p data-hf-id="hf-40e1" id="sub-el" class="subtitle">Animación Cinética de 3 Segundos con GSAP</p>
        <div data-hf-id="hf-l9ww" id="footer-el" class="footer-badge">RENDER DETERMINISTA · AGY SKILL</div>
      </section>
    </div>
    <script>
      // Timeline GSAP pausado requerido por HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Entrada cinética (0.1s a 0.85s)
      tl.fromTo("#badge-el", 
        { y: -36, opacity: 0, scale: 0.92 }, 
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 
        0.1
      );

      tl.fromTo("#title-el", 
        { y: 54, opacity: 0, scale: 0.96 }, 
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 
        0.25
      );

      tl.fromTo("#sub-el", 
        { y: 30, opacity: 0 }, 
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 
        0.5
      );

      tl.fromTo("#footer-el", 
        { opacity: 0, y: 16 }, 
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 
        0.7
      );

      // Pulso suave durante la retención sin solapamiento de escala (0.9s a 2.3s)
      tl.to("#title-el", 
        { scale: 1.035, duration: 1.4, ease: "sine.inOut" }, 
        0.9
      );

      // Salida acelerada (2.35s a 2.9s)
      tl.to(["#badge-el", "#title-el", "#sub-el", "#footer-el"], 
        { y: -28, opacity: 0, duration: 0.45, ease: "power3.in", stagger: 0.05 }, 
        2.35
      );

      // Registro oficial en el mapa de timelines de HyperFrames
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
